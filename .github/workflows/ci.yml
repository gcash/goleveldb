name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [oldstable, stable]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      # Vet also reports standard library APIs newer than the go line in
      # go.mod, so the declared minimum holds without building on it.
      - name: Vet
        run: go vet ./...
      # The timeouts are a few times the usual run time, so that a deadlock
      # fails the run in minutes rather than an hour.
      - name: Test
        run: go test -short -timeout 15m ./...
      - name: Race test
        run: go test -race -short -timeout 30m ./...

  # golangci-lint checks the code against the Go it was built with, so it
  # runs on one fixed Go version. Bump the two together.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
